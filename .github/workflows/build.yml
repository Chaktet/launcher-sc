name: Build

# Compilación del instalador de Windows en un entorno público y reproducible.
# SignPath firma el artefacto producido por ESTE flujo, y así queda verificado
# que el binario procede del código fuente de este repositorio.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    env:
      # Los secretos no se pueden consultar directamente en un "if", así que se
      # traduce aquí a un simple true/false.
      SIGNPATH_CONFIGURADO: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar instalador de Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Aquí solo se construye; la release se publica aparte con el .exe ya firmado.
        run: npx electron-builder --win --x64 --publish never

      - name: Publicar artefacto sin firmar
        id: artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      # Los pasos siguientes solo se ejecutan cuando SignPath ya está configurado.
      # Mientras SignPath Foundation no apruebe el proyecto, el secreto no existe
      # y se saltan, de modo que el flujo sigue siendo válido igualmente.
      - name: Solicitar firma a SignPath
        if: env.SIGNPATH_CONFIGURADO == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sc-launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.artefacto.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-firmado

      - name: Publicar instalador firmado
        if: env.SIGNPATH_CONFIGURADO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-firmado
          path: dist-firmado/**
          if-no-files-found: error

  # Mac y Linux (desde la 1.17.8). Los runners de GitHub son gratis en repos públicos.
  # Sin firma de Apple ni SignPath: el artefacto de aquí ES el que se publica.
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      # Un .dmg por arquitectura: arm64 (chip Apple, M1 en adelante) y x64 (Intel).
      - name: Compilar los .dmg de Mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Comprobar la firma ad hoc
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Identifier'
          done

      # Actualización automática de punta a punta (tools/prueba-actualiza-mac.js) y
      # que la app nueva, abierta por el script, sigue viva a los 30 s.
      - name: Probar la actualización automática
        run: |
          node tools/prueba-actualiza-mac.js
          sleep 30
          test ! -e "/Applications/SC Launcher.app/Contents/Resources/sc-prueba-viejo.txt"
          test ! -e "/Applications/SC Launcher.app.viejo"
          codesign --verify --deep --strict "/Applications/SC Launcher.app"
          pgrep -fl "/Applications/SC Launcher.app/Contents/MacOS/SC Launcher"
          pkill -f "/Applications/SC Launcher.app" || true

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el AppImage de Linux
        run: npx electron-builder --linux --publish never

      # Que arranca de verdad (pantalla virtual): sigue vivo a los 40 s.
      - name: Probar que el AppImage arranca
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2t64
          chmod +x dist/SC-Launcher-linux.AppImage
          set +e
          xvfb-run -a timeout 40 dist/SC-Launcher-linux.AppImage > arranque.log 2>&1
          codigo=$?
          set -e
          tail -40 arranque.log
          test $codigo -eq 124
          # Donde el sistema SÍ permite el sandbox, arranca con él (sin --no-sandbox).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a timeout 40 dist/SC-Launcher-linux.AppImage > arranque2.log 2>&1 &
          sleep 25
          ps -eo args | grep 'sc-launcher.bin' | grep -v grep | head -3 > procesos.txt || true
          wait || true
          cat procesos.txt
          grep -q 'sc-launcher.bin' procesos.txt
          ! grep -q -- '--no-sandbox' procesos.txt

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error
