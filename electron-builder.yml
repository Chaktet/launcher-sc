appId: 'es.servidorcobblemon.sclauncher'
productName: 'SC Launcher'
artifactName: 'SC-Launcher-setup-${version}.${ext}'

publish:
  provider: 'github'
  owner: 'Chaktet'
  repo: 'launcher-sc'

copyright: 'Servidor Cobblemon · basado en Helios Launcher (Daniel Scalzi)'

asar: true
compression: 'maximum'

# Solo los idiomas de Chromium que usamos (menús nativos, diálogos de fichero, mensajes de
# error del navegador). Los 55 .pak ocupaban 45 MB instalados; la interfaz del launcher va
# entera en _custom.toml y no depende de esto. Con un Windows en otro idioma Chromium cae a
# en-US, que debe quedarse SIEMPRE: sin él Electron no arranca.
electronLanguages:
  - 'es'
  - 'es-419'
  - 'en-US'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  # Material de desarrollo que se colaba en el app.asar hasta la 1.6.2: la carpeta
  # .claude (con copias de trabajo enteras), los scripts de despliegue de tools/ y
  # las guías para agentes. Nada de eso lo usa el launcher en el PC del jugador.
  - '!.claude{,/**}'
  - '!tools{,/**}'
  - '!diseno*{,/**}'
  - '!{CLAUDE.md,AGENTS.md,PRIVACY.md}'
  - '!electron-builder.firmado.yml'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  # Instalación de un solo clic (sin asistente): permite que las actualizaciones
  # se instalen en silencio desde el propio launcher y que éste se reinicie solo.
  oneClick: true
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 'SC Launcher'
  runAfterFinish: true
  # Nunca borrar los datos del jugador (cuentas, mods, mundos) al desinstalar.
  deleteAppDataOnUninstall: false

# macOS Configuration
# Sin firma de Apple (cuesta 99 $/año): firma ad hoc ('-'), la mínima para que un Mac
# con chip Apple acepte abrirlo; sin ella macOS dice «está dañado» en vez de dejar
# abrirlo desde Ajustes → Privacidad y seguridad. Sin hardenedRuntime: con firma ad hoc
# bloquearía cargar las librerías de Electron. Nombre sin versión: el servidor de
# descargas sirve siempre el último con el mismo enlace (la web y la puerta lo usan).
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'SC-Launcher-mac-${arch}.${ext}'
  category: 'public.app-category.games'
  identity: '-'
  hardenedRuntime: false
  notarize: false

dmg:
  title: 'SC Launcher'

# Linux Configuration
# AppImage: un solo fichero que funciona en casi cualquier distribución y se
# actualiza solo con electron-updater (latest-linux.yml en la release).
linux:
  target:
    - target: 'AppImage'
      arch: 'x64'
  artifactName: 'SC-Launcher-linux.${ext}'
  executableName: 'sc-launcher'
  maintainer: 'Servidor Cobblemon <https://servidorcobblemon.es>'
  vendor: 'Servidor Cobblemon'
  synopsis: 'Launcher oficial de servidorcobblemon.es'
  description: 'Launcher oficial de servidorcobblemon.es: instala y mantiene al día los mods, el pack y Java automáticamente.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'