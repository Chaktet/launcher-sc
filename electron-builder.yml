appId: 'es.servidorcobblemon.sclauncher'
productName: 'SC Launcher'
artifactName: 'SC-Launcher-setup-${version}.${ext}'

publish:
  provider: 'github'
  owner: 'Chaktet'
  repo: 'launcher-sc'

copyright: 'Servidor Cobblemon · basado en Helios Launcher (Daniel Scalzi)'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  # Instalación de un solo clic (sin asistente): permite que las actualizaciones
  # se instalen en silencio desde el propio launcher y que éste se reinicie solo.
  oneClick: true
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 'SC Launcher'
  runAfterFinish: true
  # Nunca borrar los datos del jugador (cuentas, mods, mundos) al desinstalar.
  deleteAppDataOnUninstall: false

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'