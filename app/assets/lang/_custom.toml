errGraficos = "El juego no ha podido iniciar los gráficos.<br>Casi siempre son los <b>drivers de la tarjeta gráfica</b>: desactualizados, sin instalar, o los genéricos que pone Windows por su cuenta.<br><br>Actualízalos según tu tarjeta:<br>• <b>NVIDIA</b> — nvidia.com/es-es/drivers<br>• <b>AMD / Radeon</b> — amd.com/es/support<br>• <b>Intel</b> — intel.es/content/www/es/es/download-center/home.html<br><br>Si tu equipo es antiguo y aun así no arranca, prueba la versión <b>LITE</b> y desactiva los mods visuales en Ajustes → Mods."
