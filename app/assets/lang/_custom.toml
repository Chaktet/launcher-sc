errDistro = "No se ha podido conectar con el servidor de descargas para saber qué archivos hacen falta.<br>Comprueba tu conexión a internet. Si usas VPN o el wifi de un colegio o trabajo, prueba con otra red."
errReparacion = "Ha fallado el proceso que descarga y repara los archivos del juego.<br>Casi siempre es el antivirus o el disco lleno. Comprueba que te queda espacio libre y añade el launcher a las excepciones de tu antivirus."
errVerificacion = "No se han podido comprobar los archivos ya descargados.<br>Puede que alguno esté dañado o que el antivirus lo haya puesto en cuarentena. Vuelve a intentarlo; el launcher los descargará de nuevo."
errDescarga = "Se ha cortado la descarga de los mods o los recursos.<br>Suele ser la conexión o falta de espacio en el disco. Comprueba ambas cosas y dale a JUGAR otra vez."
errDescargaSinRespuesta = "<b>No es tu PC ni es nuestro servidor.</b> El servidor está funcionando: lo que pasa es que tus datos no llegan hasta él.<br><br>🇪🇸 <b>Si estás en España, casi seguro es esto:</b> durante los partidos de fútbol, los operadores (Movistar, Vodafone, Orange, DIGI, MasOrange) bloquean por orden judicial rangos enteros de IPs para cortar las emisiones piratas, y se llevan por delante miles de webs que no tienen nada que ver — la nuestra entre ellas. Por eso tampoco te carga la web del servidor.<br><br>Qué puedes hacer:<br><br>1. <b>Tira de los datos del móvil</b> (compartir internet). Suele funcionar al momento.<br>2. <b>Usa una VPN</b> mientras dure el partido.<br>3. <b>Cambia los DNS a 1.1.1.1</b> — a veces basta.<br>4. <b>Espera un rato.</b> El bloqueo se levanta al acabar el partido.<br><br>Pulsa <b>Reintentar</b> cuando lo hayas probado."
errDescargaCertificado = "<b>Algo en el camino está suplantando a nuestro servidor</b>, así que el launcher no puede fiarse de lo que descarga y se para.<br><br>🇪🇸 <b>Si estás en España y hay partido de fútbol, casi seguro es tu operador.</b> Durante los partidos algunos operadores, DIGI sobre todo, contestan en lugar de las webs bloqueadas con su propio certificado para enseñar un aviso. No es tu PC ni tu antivirus.<br><br>Mientras dure el partido puedes:<br>1. <b>Usar los datos del móvil</b> (compartir internet).<br>2. <b>Usar una VPN</b>.<br>3. <b>Esperar</b> a que acabe y pulsar Reintentar.<br><br>Si no es día de partido, puede ser un wifi público que pide identificarte antes de navegar (hotel, tren, biblioteca), la red de un colegio o un trabajo, o un programa que analiza el tráfico."
errDescargaLocal = "<b>Un programa de tu equipo o de tu red está abriendo tus conexiones seguras</b>, y el launcher no puede fiarse de lo que descarga.<br><br>Lo hemos comprobado: el certificado que le llega al launcher no es el de nuestro servidor ni la página de aviso de un operador, sino el de un programa que revisa tus conexiones. Es algo de tu lado.<br><br>{quien}<br><br>El certificado que te llega lo firma:<span class='sc-ruta'>{emisor}</span><br>Añadir el launcher a la lista blanca del antivirus <b>no basta</b>: hay que desactivar la opción que analiza el tráfico cifrado (<i>Análisis HTTPS</i>, <i>Escaneo SSL</i> o <i>Web Shield</i>) y después cerrar y volver a abrir el launcher. Si estás en la red de un colegio o un trabajo, prueba con los datos del móvil."
errDescargaInterceptorConocido = "Es <b>{nombre}</b>."
errDescargaInterceptorDesconocido = "No reconocemos el programa por el nombre del certificado. Suele ser un antivirus, un filtro de la red o un programa de anuncios."
errDescargaReloj = "<b>La fecha o la hora de tu equipo están mal</b>, y por eso los certificados de nuestro servidor parecen caducados o todavía no válidos.<br><br>Tu equipo dice que son las <b>{hora}</b>.<br><br>Arréglalo en Configuración de Windows → Hora e idioma → Fecha y hora: activa <b>Establecer la hora automáticamente</b> y pulsa <b>Sincronizar ahora</b>. Después pulsa Reintentar."
errDescargaDisco = "<b>Te has quedado sin espacio en el disco.</b><br><br>El juego y el paquete de texturas necesitan unos 2 GB libres. Libera espacio y pulsa Reintentar."
errLibrerias = "Faltan archivos necesarios para arrancar el juego.<br>Vuelve a pulsar JUGAR: el launcher los descargará de nuevo automáticamente."
errJvm = "El juego no ha llegado a abrirse.<br>Lo más habitual es que tengas asignada demasiada memoria en Ajustes → Java, o que el antivirus haya bloqueado Java. Prueba a bajar la memoria asignada."
errGraficos = "El juego no ha podido iniciar los gráficos.<br>Casi siempre son los <b>drivers de la tarjeta gráfica</b>: desactualizados, sin instalar, o los genéricos que pone Windows por su cuenta.<br><br>Actualízalos según tu tarjeta:<br>• <b>NVIDIA</b> — nvidia.com/es-es/drivers<br>• <b>AMD / Radeon</b> — amd.com/es/support<br>• <b>Intel</b> — intel.es/content/www/es/es/download-center/home.html<br><br>Si tu equipo es antiguo y aun así no arranca, prueba la versión <b>LITE</b> y desactiva los mods visuales en Ajustes → Mods."
errGraficosNvidia = "🟩 Hemos detectado una <b>NVIDIA</b>: descarga el driver en <b>nvidia.com/es-es/drivers</b> (o pulsa Buscar actualizaciones en GeForce Experience / la app NVIDIA)."
errGraficosAmd = "🟥 Hemos detectado una <b>AMD / Radeon</b>: descarga el driver en <b>amd.com/es/support</b> (o abre AMD Software: Adrenalin y busca actualizaciones)."
errGraficosIntel = "🟦 Hemos detectado gráficos <b>Intel</b>: descarga el driver en <b>intel.es/content/www/es/es/download-center/home.html</b> (o usa el Asistente de Controladores Intel).<br>⚠ Si tu Intel es muy antigua (HD Graphics de 3ª generación o anterior) puede que no llegue a lo que exige Minecraft 1.21."
errDriverIntel = "Los <b>drivers de tu gráfica Intel</b> son demasiado antiguos y el juego se niega a arrancar con ellos porque se colgaría.<br><br>Tienes la versión <b>{instalada}</b> y hace falta la <b>{requerida}</b> o superior.<br><br>⚠ <b>Windows Update no te va a dar esa versión</b>: instala una más antigua. Hay que bajarla a mano:<br>1. Entra en <b>intel.com/content/www/us/en/download/18606</b><br>2. Descarga el paquete <b>15.33.53.5161</b> e instálalo.<br>3. Reinicia el ordenador.<br><br>Si el instalador dice que no está validado para tu equipo: Administrador de dispositivos → Adaptadores de pantalla → botón derecho en la Intel → Actualizar controlador → Buscar en mi PC → Elegir de una lista → Usar disco, y apunta a la carpeta que has descargado."
errDriverNvidia = "Los <b>drivers de tu gráfica NVIDIA</b> son demasiado antiguos y el juego se niega a arrancar con ellos porque se colgaría.<br><br>Tienes la versión <b>{instalada}</b> y hace falta la <b>{requerida}</b> o superior.<br><br>Descárgalos en <b>nvidia.com/es-es/drivers</b>, o abre la app de NVIDIA / GeForce Experience y busca actualizaciones. Reinicia el ordenador al terminar."
errJavaBloqueado = "Java se ha instalado correctamente, pero <b>tu sistema no le deja arrancar</b>.<br><br>Esto es casi siempre el <b>antivirus</b>, que bloquea o pone en cuarentena los programas recién descargados.<br><br>Añade esta carpeta a las excepciones de tu antivirus y vuelve a intentarlo:<br><span class='sc-ruta'>{ruta}</span><br><br>Si no quieres tocar el antivirus, instala <b>Java 21 (64 bits)</b> tú mismo desde <b>adoptium.net</b> — elige el instalador <b>.msi</b>. Al quedar en Archivos de programa, los antivirus no suelen molestarlo."
