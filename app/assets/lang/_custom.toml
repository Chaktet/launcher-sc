javaNoReparado = "No se han podido borrar los archivos de Java.<br><br>Ciérralo todo y bórralos a mano: son la carpeta <b>runtime</b> dentro de la carpeta de datos del launcher. Después vuelve a pulsar JUGAR."
errMemoria = "El juego se ha quedado sin memoria.<br>Ve a <b>Ajustes → Java</b> y ajusta la memoria asignada: si tienes poca RAM, prueba a bajarla; si tienes de sobra, súbela un poco. Cierra también otros programas pesados como el navegador."
