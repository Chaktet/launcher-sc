errDriverIntel = "Los <b>drivers de tu gráfica Intel</b> son demasiado antiguos y el juego se niega a arrancar con ellos porque se colgaría.<br><br>Tienes la versión <b>{instalada}</b> y hace falta la <b>{requerida}</b> o superior.<br><br>⚠ <b>Windows Update no te va a dar esa versión</b>: instala una más antigua. Hay que bajarla a mano:<br>1. Entra en <b>intel.com/content/www/us/en/download/18606</b><br>2. Descarga el paquete <b>15.33.53.5161</b> e instálalo.<br>3. Reinicia el ordenador.<br><br>Si el instalador dice que no está validado para tu equipo: Administrador de dispositivos → Adaptadores de pantalla → botón derecho en la Intel → Actualizar controlador → Buscar en mi PC → Elegir de una lista → Usar disco, y apunta a la carpeta que has descargado."
errDriverNvidia = "Los <b>drivers de tu gráfica NVIDIA</b> son demasiado antiguos y el juego se niega a arrancar con ellos porque se colgaría.<br><br>Tienes la versión <b>{instalada}</b> y hace falta la <b>{requerida}</b> o superior.<br><br>Descárgalos en <b>nvidia.com/es-es/drivers</b>, o abre la app de NVIDIA / GeForce Experience y busca actualizaciones. Reinicia el ordenador al terminar."
errJavaBloqueado = "Java se ha instalado correctamente, pero <b>tu sistema no le deja arrancar</b>.<br><br>Esto es casi siempre el <b>antivirus</b>, que bloquea o pone en cuarentena los programas recién descargados.<br><br>Añade esta carpeta a las excepciones de tu antivirus y vuelve a intentarlo:<br><span class='sc-ruta'>{ruta}</span><br><br>Si no quieres tocar el antivirus, instala <b>Java 21 (64 bits)</b> tú mismo desde <b>adoptium.net</b> — elige el instalador <b>.msi</b>. Al quedar en Archivos de programa, los antivirus no suelen molestarlo."
errJavaRoto = "Tu instalación de Java está incompleta: le faltan archivos.<br>Casi siempre es el antivirus, que ha puesto en cuarentena parte de la descarga.<br><br>Pulsa <b>Reparar Java</b> y el launcher la borrará y la descargará entera de nuevo. Si vuelve a pasar, añade la carpeta del launcher a las excepciones de tu antivirus."
repararJava = "Reparar Java"
