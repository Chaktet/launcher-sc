errMemoria = "El juego se ha quedado sin memoria.<br>Ve a <b>Ajustes → Java</b> y ajusta la memoria asignada: si tienes poca RAM, prueba a bajarla; si tienes de sobra, súbela un poco. Cierra también otros programas pesados como el navegador."
errRam = "Tienes asignados <b>{asignada} GB</b> de memoria al juego, pero tu equipo solo tiene <b>{total} GB</b> en total.<br><br>Con esa configuración el juego no puede arrancar. Ve a <b>Ajustes → Java</b> y baja la memoria asignada (lo recomendable es dejar al menos 2 GB libres para Windows)."
errDisco = "<b>No queda espacio suficiente en el disco.</b><br><br>Te quedan <b>{libre} GB</b> libres y el juego necesita al menos <b>{necesario} GB</b> para descargar y actualizar sus archivos.<br><br>El launcher guarda el juego en:<span class='sc-ruta'>{ruta}</span>Libera espacio en ese disco (vacía la papelera, borra descargas o programas que no uses) y vuelve a pulsar JUGAR."
