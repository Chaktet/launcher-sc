# Ruta directa al origen · esquiva el bloqueo de Cloudflare en España.
#
# Sirve EXACTAMENTE el mismo /var/www/packs que packs.conf, con las mismas
# cabeceras de cache, pero por un nombre cuya nube de Cloudflare esta apagada.
# Asi, cuando los operadores espanoles bloquean rangos de IPs de Cloudflare
# durante los partidos, el launcher tiene por donde salir.
#
# Va en :443, que es OTRO socket: no altera el orden del default server de *:80,
# que es packs.conf y del que depende que descargas.servidorcobblemon.es siga
# funcionando. Ese es el punto fragil de esta maquina — no lo toques.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName directo.servidorcobblemon.es
    DocumentRoot /var/www/packs

    <Directory /var/www/packs>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Mismas cabeceras que packs.conf, para que el pack se comporte igual por
    # las dos rutas. Aqui no hay CDN delante, asi que 'immutable' solo afecta a
    # la cache del cliente (y el cliente HTTP del launcher no cachea), pero se
    # mantiene por coherencia.
    <FilesMatch "\.zip$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch ".(exe|mrpack)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Log propio, para poder medir cuanta gente esta usando el escape.
    # Aqui NO hay Cloudflare, asi que la IP real es %a y no CF-Connecting-IP.
    LogFormat "%a %t \"%r\" %>s" scdirecto
    CustomLog ${APACHE_LOG_DIR}/packs_directo.log scdirecto
    ErrorLog ${APACHE_LOG_DIR}/packs_directo_error.log

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/directo.servidorcobblemon.es/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/directo.servidorcobblemon.es/privkey.pem
</VirtualHost>
</IfModule>
